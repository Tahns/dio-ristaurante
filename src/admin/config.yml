# Configuration de l'administration du site (Sveltia CMS, compatible Decap CMS).
# Chaque enregistrement crée un commit sur GitHub ; le site est ensuite régénéré et publié automatiquement.
backend:
  name: github
  repo: Tahns/paintball-lille
  branch: main
  commit_messages:
    create: "Admin : ajout de {{collection}} « {{slug}} »"
    update: "Admin : modification de {{collection}} « {{slug}} »"
    delete: "Admin : suppression de {{collection}} « {{slug}} »"
    uploadMedia: "Admin : ajout de l'image {{path}}"
    deleteMedia: "Admin : suppression de l'image {{path}}"

locale: fr
media_folder: src/assets/photos/uploads
public_folder: /assets/photos/uploads

collections:
  - name: actualites
    label: Actualités
    label_singular: Actualité
    description: Plats du moment, soirées, événements. Les 3 plus récentes apparaissent sur la page d'accueil.
    folder: src/actualites
    create: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: [date, title]
    summary: "{{title}} ({{date}})"
    fields:
      - { name: title, label: Titre, widget: string }
      - { name: date, label: Date de publication, widget: datetime, time_format: false, format: "YYYY-MM-DD" }
      - { name: summary, label: Résumé (1 ou 2 phrases), widget: text, required: false }
      - { name: image, label: Photo, widget: image, required: false }
      - { name: draft, label: Brouillon (non publié), widget: boolean, default: false, required: false }
      - { name: body, label: Texte, widget: markdown, buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list], editor_components: [image] }

  - name: reglages
    label: Infos du restaurant
    editor: { preview: false }
    files:
      - name: site
        label: Carte, contacts, parking, photos, avis, infos légales
        file: src/data/site.json
        format: json
        fields:
          - { name: name, label: Nom du restaurant, widget: string }
          - { name: baseUrl, label: Adresse du site (ne pas modifier), widget: string }
          - { name: tagline, label: Slogan, widget: string }
          - { name: hours, label: "Horaires (texte court, ex. Midi et soir, du mardi au samedi)", widget: string }
          - { name: services, label: "Services (Sur place, À emporter…)", widget: list, field: { name: item, label: Service, widget: string } }

          - name: parking
            label: Parking (affiché sur toutes les pages)
            widget: object
            fields:
              - { name: title, label: Titre, widget: string }
              - { name: text, label: Explication pour trouver le parking, widget: text }
              - { name: detail, label: "Précision (ex. entrée par la rue X, 30 places)", widget: string, required: false }

          - name: phones
            label: Téléphone
            widget: object
            fields:
              - name: resto
                label: Numéro du restaurant
                widget: object
                fields:
                  - { name: label, label: Libellé, widget: string }
                  - { name: display, label: "Numéro affiché (ex. 03 20 00 00 00)", widget: string, required: false }
                  - { name: tel, label: "Numéro international (ex. +33320000000)", widget: string, required: false }
          - { name: email, label: "E-mail (reçoit les demandes si aucun service d'envoi n'est configuré)", widget: string, required: false }
          - name: address
            label: Adresse
            widget: object
            fields:
              - { name: street, label: Numéro et rue, widget: string, required: false }
              - { name: postalCode, label: Code postal, widget: string }
              - { name: city, label: Ville, widget: string }
              - { name: region, label: Région, widget: string }
              - { name: country, label: Pays (code), widget: string }
          - name: social
            label: Réseaux sociaux (laisser vide pour masquer)
            widget: object
            fields:
              - { name: facebook, label: Facebook, widget: string, required: false }
              - { name: instagram, label: Instagram, widget: string, required: false }
              - { name: tiktok, label: TikTok, widget: string, required: false }
          - { name: formEndpoint, label: "Adresse d'envoi du formulaire (Formspree, recommandé)", widget: string, required: false }

          - { name: menuNote, label: Message sous le titre de la carte, widget: string }
          - name: menu
            label: La carte
            label_singular: Rubrique
            widget: list
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - { name: id, label: "Identifiant (sans accent, ex. pizzas)", widget: string }
              - { name: title, label: Titre, widget: string }
              - { name: intro, label: Phrase d'introduction, widget: string, required: false }
              - name: items
                label: Plats
                label_singular: Plat
                widget: list
                summary: "{{fields.name}} {{fields.price}}"
                fields:
                  - { name: name, label: Nom, widget: string }
                  - { name: desc, label: Description (ingrédients), widget: string, required: false }
                  - { name: price, label: "Prix (ex. 12 €, laisser vide pour ne pas l'afficher)", widget: string, required: false }

          - name: privatisation
            label: Privatisation
            widget: object
            collapsed: true
            fields:
              - { name: intro, label: Texte d'introduction, widget: text }
              - { name: capacity, label: "Capacité (facultatif)", widget: string, required: false }
              - name: formulas
                label: Formules
                label_singular: Formule
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { name: name, label: Nom, widget: string }
                  - { name: text, label: Description, widget: text }

          - name: images
            label: Logo et photo d'accueil
            widget: object
            fields:
              - { name: logo, label: Logo, widget: image, required: false }
              - { name: hero, label: "Photo d'accueil (paysage, 1920 px)", widget: image, required: false }
          - name: gallery
            label: Galerie photos
            label_singular: Photo
            widget: list
            summary: "{{fields.alt}}"
            fields:
              - { name: image, label: Photo, widget: image }
              - { name: alt, label: "Description courte (ex. Pizza burrata)", widget: string }

          - name: reviews
            label: Avis clients
            widget: object
            fields:
              - { name: rating, label: "Note (ex. 4,7), vide pour masquer", widget: string, required: false }
              - { name: count, label: Nombre d'avis, widget: string, required: false }
              - { name: source, label: Source, widget: string, default: Google }
              - name: items
                label: Avis affichés
                label_singular: Avis
                widget: list
                required: false
                summary: "{{fields.author}}"
                fields:
                  - { name: author, label: Auteur, widget: string }
                  - { name: rating, label: Note sur 5, widget: number, value_type: int, min: 1, max: 5, default: 5 }
                  - { name: date, label: "Date (ex. août 2026)", widget: string, required: false }
                  - { name: text, label: Avis, widget: text }

          - name: legal
            label: Infos légales
            widget: object
            collapsed: true
            fields:
              - { name: company, label: Raison sociale et forme juridique, widget: string, required: false }
              - { name: siret, label: SIRET, widget: string, required: false }
              - { name: registration, label: "Immatriculation (RCS ou RNE, capital)", widget: string, required: false }
              - { name: vat, label: TVA intracommunautaire, widget: string, required: false }
              - { name: director, label: Directeur de la publication, widget: string, required: false }
              - { name: mediator, label: Médiateur de la consommation, widget: string, required: false }
              - { name: host, label: Hébergeur, widget: string }
